# ==============================================================================
# Hyprlock — lock screen
# File: ~/.config/hypr/hyprlock.conf
#
# Visual language:
#   - blurred screenshot of the current desktop;
#   - dark glass card;
#   - purple/lavender accents matching Waybar / Kitty / Fuzzel / SwayNC;
#   - JetBrainsMono Nerd Font;
#   - 24-hour clock and localized date.
#
# IMPORTANT:
# Hyprlock is a security boundary, not just decoration.
# PAM authentication remains enabled and uses /etc/pam.d/hyprlock.
# ==============================================================================


# ------------------------------------------------------------------------------
# PALETTE
# ------------------------------------------------------------------------------

$font       = JetBrainsMono Nerd Font

$bg         = rgba(11, 11, 18, 0.78)
$surface    = rgba(24, 22, 34, 0.84)
$surface2   = rgba(33, 29, 53, 0.92)

$text       = rgba(241, 239, 248, 1.0)
$text_soft  = rgba(203, 200, 216, 1.0)
$muted      = rgba(143, 139, 156, 1.0)

$purple     = rgba(124, 108, 255, 0.95)
$purple2    = rgba(109, 93, 252, 0.95)
$lavender   = rgba(180, 135, 255, 0.95)

$red        = rgba(255, 107, 129, 0.95)
$yellow     = rgba(232, 201, 122, 0.95)
$green      = rgba(120, 219, 169, 0.95)


# ------------------------------------------------------------------------------
# GENERAL
# ------------------------------------------------------------------------------

general {
    # Mouse cursor is visual noise on a lock screen.
    hide_cursor = true

    # Pressing Enter on an empty field should not trigger a pointless PAM request.
    ignore_empty_input = true

    # Render the lock UI immediately, then finish loading the screenshot/blur.
    immediate_render = true

    # Auto is best for mixed-DPI setups.
    fractional_scaling = 2

    # GPU screencopy. This is the normal/default fast path.
    screencopy_mode = 0

    # Failed-auth message remains visible for 2 seconds.
    fail_timeout = 2000
}


# ------------------------------------------------------------------------------
# AUTHENTICATION
# ------------------------------------------------------------------------------

auth {
    # Standard Arch / Hyprlock PAM path:
    #   /etc/pam.d/hyprlock
    pam:enabled = true
    pam:module = hyprlock

    # Desktop PC: no fingerprint assumptions.
    # If a fingerprint reader is added later:
    # fingerprint:enabled = true
    fingerprint:enabled = false
}


# ------------------------------------------------------------------------------
# ANIMATIONS
# ------------------------------------------------------------------------------

animations {
    enabled = true

    bezier = lockEase, 0.20, 0.90, 0.20, 1.00

    # Small, fast transitions; the lock screen should feel immediate.
    animation = fadeIn,          1, 3.0, lockEase
    animation = fadeOut,         1, 2.5, lockEase
    animation = inputFieldFade,  1, 2.5, lockEase
    animation = inputFieldDots,  1, 2.0, lockEase
    animation = inputFieldColors,1, 2.0, lockEase
}


# ------------------------------------------------------------------------------
# BACKGROUND
# ------------------------------------------------------------------------------

background {
    monitor =

    # Capture whatever is currently on the desktop and heavily blur it.
    # This keeps the lock screen visually connected to the active wallpaper,
    # without exposing readable window contents.
    path = screenshot

    # Fallback while screenshot resources are initializing.
    color = rgba(11, 11, 18, 1.0)

    blur_passes = 4
    blur_size = 8

    # Darken the blurred screenshot substantially.
    brightness = 0.48
    contrast = 0.92

    # Slightly retain our wallpaper color palette.
    vibrancy = 0.16
    vibrancy_darkness = 0.05

    # Tiny grain prevents large blurred gradients from looking too sterile.
    noise = 0.010
}


# ------------------------------------------------------------------------------
# CENTRAL GLASS CARD
# ------------------------------------------------------------------------------

shape {
    monitor =

    size = 470, 360
    color = $bg

    rounding = 24

    border_size = 1
    border_color = rgba(124, 108, 255, 0.35)

    position = 0, 0
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_boost = 1.3

    # Put card behind labels/input.
    zindex = 0
}


# ------------------------------------------------------------------------------
# CLOCK
# ------------------------------------------------------------------------------

label {
    monitor =

    # Built-in Hyprlock variable, 24-hour format.
    text = $TIME

    color = $text
    font_size = 72
    font_family = $font

    position = 0, 86
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.35)

    zindex = 2
}


# ------------------------------------------------------------------------------
# DATE
# ------------------------------------------------------------------------------

label {
    monitor =

    # Uses the user's current locale.
    # Updated once a minute.
    text = cmd[update:60000] date "+%A, %d %B"

    color = $muted
    font_size = 14
    font_family = $font

    position = 0, 34
    halign = center
    valign = center

    zindex = 2
}


# ------------------------------------------------------------------------------
# USER / KEYBOARD LAYOUT
# ------------------------------------------------------------------------------

label {
    monitor =

    # $USER and $LAYOUT are Hyprlock substitution variables.
    text = 󰌾  $USER   ·   $LAYOUT

    color = $text_soft
    font_size = 13
    font_family = $font

    position = 0, -12
    halign = center
    valign = center

    zindex = 2
}


# ------------------------------------------------------------------------------
# PASSWORD FIELD
# ------------------------------------------------------------------------------

input-field {
    monitor =

    size = 360, 58
    outline_thickness = 2

    dots_size = 0.24
    dots_spacing = 0.20
    dots_center = true
    dots_rounding = -1

    # Purple -> lavender border.
    outer_color = $purple $lavender 45deg
    inner_color = $surface
    font_color = $text

    font_family = $font

    # Always keep the field visible; visually clearer than disappearing on idle.
    fade_on_empty = false

    placeholder_text = <span foreground="##8f8b9c">Password for $USER</span>

    hide_input = false
    rounding = 16

    # Authentication feedback.
    check_color = $yellow $purple 45deg
    check_text = <span foreground="##e8c97a">Checking…</span>

    fail_color = $red $purple 45deg
    fail_text = <span foreground="##ff6b81">$FAIL</span>

    capslock_color = $yellow
    numlock_color = $green
    bothlock_color = $lavender

    position = 0, -72
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 5
    shadow_color = rgba(0, 0, 0, 0.30)

    zindex = 2
}


# ------------------------------------------------------------------------------
# FOOTER
# ------------------------------------------------------------------------------

label {
    monitor =

    text = <span foreground="##5b5769">Esc / Ctrl+U clears input</span>

    color = $muted
    font_size = 10
    font_family = $font

    position = 0, -132
    halign = center
    valign = center

    zindex = 2
}
