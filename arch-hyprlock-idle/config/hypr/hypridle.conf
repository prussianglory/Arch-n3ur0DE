# ==============================================================================
# Hypridle — idle / lock / DPMS policy
# File: ~/.config/hypr/hypridle.conf
#
# Active policy for this desktop:
#
#   5 min idle   -> lock session
#   10 min idle  -> turn displays off (DPMS)
#   activity     -> turn displays back on
#   any suspend  -> lock BEFORE sleeping
#
# Automatic suspend is intentionally NOT enabled by default.
#
# Idle inhibitors from browsers/media players/systemd are respected.
# ==============================================================================


general {
    # This is the ONE place that defines which locker is launched for a
    # logind / D-Bus lock request.
    #
    # `pidof ... || ...` prevents duplicate Hyprlock instances.
    lock_cmd = pidof hyprlock || hyprlock

    # Before ANY suspend/hibernate route, request a session lock.
    #
    # `loginctl lock-session` emits the lock request.
    # Hypridle receives it and runs lock_cmd above.
    before_sleep_cmd = loginctl lock-session

    # Ensure monitors are enabled immediately after resume.
    # This uses the current Hyprland dispatcher syntax.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    # Respect applications that explicitly say "do not idle":
    # browser video, presentation tools, games, etc.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
    ignore_wayland_inhibit = false

    # Wait for a Wayland session-lock application to actually lock the
    # session before sleep proceeds.
    inhibit_sleep = 3
}


# ------------------------------------------------------------------------------
# 5 MINUTES — LOCK
# ------------------------------------------------------------------------------

listener {
    timeout = 300

    # Going through logind means manual lock requests and suspend locking
    # share the same Hypridle -> Hyprlock path.
    on-timeout = loginctl lock-session

    ignore_inhibit = false
}


# ------------------------------------------------------------------------------
# 10 MINUTES — MONITORS OFF
# ------------------------------------------------------------------------------

listener {
    timeout = 600

    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'

    # User input after this listener fired wakes the displays.
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'

    ignore_inhibit = false
}


# ------------------------------------------------------------------------------
# OPTIONAL: AUTO-SUSPEND
#
# Disabled for this desktop build because long compiles, downloads,
# VMs, labs and remote work should not be interrupted unexpectedly.
#
# If you later decide you want it, uncomment a listener like:
#
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
#     ignore_inhibit = false
# }
#
# For a workstation that may receive SSH sessions, use `condition_cmd`
# before enabling automatic suspend. See README.md.
# ------------------------------------------------------------------------------
