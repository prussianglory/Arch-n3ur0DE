# ==============================================================================
# Fuzzel — цвета
# Файл: ~/.config/fuzzel/colors.ini
#
# Формат цвета Fuzzel:
#   RRGGBBAA
#
# Здесь НЕТ символа #.
#
# Основная палитра совпадает с Kitty / Waybar / Starship:
#   background  #0b0b12
#   purple      #7c6cff
#   purple-2    #6d5dfc
#   lavender    #b487ff
# ==============================================================================

[colors]

# Почти чёрный фон, ~95% opacity.
# Прозрачность позволяет Hyprland blur слегка просматриваться.
background=0b0b12f2

# Обычный текст.
text=cbc8d8ff

# Дополнительное информационное сообщение.
message=8f8b9cff

# Иконка prompt.
prompt=b487ffff

# Placeholder до начала ввода.
placeholder=5b5769ff

# Набираемый запрос.
input=f1eff8ff

# Подсвеченный фрагмент совпадения.
match=9c8cffff

# Фон выбранной строки.
selection=211d35ee

# Текст выбранной строки.
selection-text=ffffffff

# Совпавший фрагмент внутри выбранной строки.
selection-match=c7a4ffff

# Счётчик совпадений.
counter=6f6b7dff

# Фиолетовая рамка.
border=6d5dfcff


[border]

# Тонкая рамка: Hyprland уже даёт нам визуальную глубину через blur.
width=2

# Внешнее скругление.
radius=18

# Скругление selected row.
selection-radius=10
