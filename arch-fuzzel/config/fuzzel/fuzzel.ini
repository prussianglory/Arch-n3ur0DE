# ==============================================================================
# Fuzzel — основной конфиг
# Файл: ~/.config/fuzzel/fuzzel.ini
#
# Роль Fuzzel в нашем Arch + Hyprland rice:
#   - основной launcher приложений;
#   - backend для небольших dmenu/picker-меню;
#   - используется Waybar power menu.
#
# Цвета вынесены отдельно:
#   ~/.config/fuzzel/colors.ini
#
# Проверка конфига:
#   fuzzel --check-config
# ==============================================================================

[main]

# ------------------------------------------------------------------------------
# ТЕМА
# ------------------------------------------------------------------------------

# Fuzzel поддерживает include.
# Путь начинается с ~/, поэтому конфиг остаётся переносимым между пользователями.
include=~/.config/fuzzel/colors.ini

# Тот же Nerd Font, что у Kitty и Waybar.
font=JetBrainsMono Nerd Font:size=12

# Разрешаем Fuzzel использовать bold-начертание там, где это уместно.
use-bold=yes

# Автоматически учитывать DPI / scaling мониторов.
dpi-aware=auto


# ------------------------------------------------------------------------------
# PROMPT / ПОИСК
# ------------------------------------------------------------------------------

# Nerd Font search icon.
# Кавычки нужны в том числе для сохранения пробелов после символа.
prompt="  "

placeholder=Search applications…

# fzf-style matching — хороший баланс между точностью и быстрым поиском.
match-mode=fzf

# Fuzzel сортирует результаты с учётом качества совпадения и истории запусков.
sort-result=yes

# Показываем "3/124" справа от строки поиска.
match-counter=yes

# Фильтруем .desktop-файлы по XDG_CURRENT_DESKTOP.
# Для Hyprland это убирает часть нерелевантных desktop entries.
filter-desktop=yes

# Не показываем отдельными строками Desktop Actions вроде
# "New Private Window" / "Preferences".
# Если захочешь — переключи на yes.
show-actions=no

# Не запускаем автоматически единственный оставшийся результат.
# Enter остаётся явным подтверждением.
auto-select=no


# ------------------------------------------------------------------------------
# ИКОНКИ
# ------------------------------------------------------------------------------

icons-enabled=yes

# Пакет:
#   sudo pacman -S papirus-icon-theme
icon-theme=Papirus-Dark

# Не показываем огромную preview-иконку, когда результатов становится мало.
# Иконки рядом с обычными строками при этом остаются.
image-size-ratio=0


# ------------------------------------------------------------------------------
# РАЗМЕР И ГЕОМЕТРИЯ
# ------------------------------------------------------------------------------

# Command-palette style: окно по центру.
anchor=center

# Максимум результатов.
lines=8

# В dmenu-режиме (например, power menu) уменьшаем окно до реального
# количества переданных пунктов.
minimal-lines=yes

# Ширина задаётся примерно в символах.
width=46

# Внутренние отступы.
horizontal-pad=28
vertical-pad=14

# Отступ между input и списком результатов.
inner-pad=10

# Высота строки. Можно увеличить до 30px для более "воздушного" интерфейса.
line-height=28px

letter-spacing=0


# ------------------------------------------------------------------------------
# WAYLAND / HYPRLAND
# ------------------------------------------------------------------------------

# Namespace используется Hyprland layer rules.
# Его можно увидеть через:
#   hyprctl layers
namespace=launcher

# overlay позволяет launcher отображаться поверх fullscreen-приложений.
layer=overlay

# Пока Fuzzel открыт, клавиатура полностью принадлежит ему.
keyboard-focus=exclusive

# При потере keyboard focus launcher закрывается.
exit-on-keyboard-focus-loss=yes


# ------------------------------------------------------------------------------
# TERMINAL APPLICATIONS
# ------------------------------------------------------------------------------

# Некоторые .desktop-файлы содержат Terminal=true.
# В таком случае Fuzzel запустит их в нашем Kitty.
#
# Современный Kitty принимает исполняемую команду обычными аргументами;
# `{cmd}` Fuzzel подставляет на место команды из desktop entry.
terminal=kitty -- {cmd}


# ------------------------------------------------------------------------------
# EXECUTABLES ИЗ $PATH
# ------------------------------------------------------------------------------

# Обычный launcher показывает XDG applications.
#
# Если включить yes, туда попадут также бинарники из $PATH:
#   list-executables-in-path=yes
#
# Для основного launcher это быстро превращается в шум, поэтому оставляем no.
list-executables-in-path=no


# ------------------------------------------------------------------------------
# МЫШЬ
# ------------------------------------------------------------------------------

enable-mouse=yes


# ------------------------------------------------------------------------------
# DMENU MODE
#
# Waybar power menu уже использует:
#   fuzzel --dmenu
# ------------------------------------------------------------------------------

[dmenu]

# В stdout возвращается выбранный текст.
mode=text

# Если stdin пуст, не показываем бессмысленное пустое окно.
exit-immediately-if-empty=yes


# ------------------------------------------------------------------------------
# KEY BINDINGS
#
# Здесь ничего не переопределяем без необходимости:
#
#   Up / Ctrl+P           предыдущий результат
#   Down / Ctrl+N         следующий
#   Enter                 запустить / выбрать
#   Tab                   выбрать следующий / выполнить единственное совпадение
#   Esc / Ctrl+C          закрыть
#   Ctrl+V                вставить clipboard
#   Shift+Delete          удалить приложение из frequency cache
#
# Если захочешь Vim-like Ctrl+J/Ctrl+K — добавим осознанно:
# Ctrl+K сейчас уже используется Fuzzel для delete-line-forward.
# ------------------------------------------------------------------------------

[key-bindings]

# Пример пользовательского бинда:
# next-with-wrap=Mod1+j
# prev-with-wrap=Mod1+k
