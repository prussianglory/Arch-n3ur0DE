# ==============================================================================
# Kitty — цветовая схема Arch/Hyprland rice
# Файл: ~/.config/kitty/theme.conf
#
# Главная идея — почти чёрный холодный фон + фиолетовые акценты.
# Цвета подобраны так, чтобы терминал сочетался с нашим Waybar.
#
# Если захочешь полностью поменять тему — достаточно заменить этот файл.
# ==============================================================================


# ------------------------------------------------------------------------------
# ОСНОВНЫЕ ЦВЕТА
# ------------------------------------------------------------------------------

foreground            #e8e7f2
background            #0b0b12

# Текст второстепенного уровня.
inactive_text_alpha    1.0

# Выделение.
selection_foreground   #ffffff
selection_background   #5d4ee8

# URL.
url_color              #9c8cff

# Курсор.
cursor                  #b8a8ff
cursor_text_color       #0b0b12
cursor_trail_color      #7c6cff


# ------------------------------------------------------------------------------
# ВНУТРЕННИЕ KITTY WINDOWS
# ------------------------------------------------------------------------------

active_border_color     #7c6cff
inactive_border_color   #292538
bell_border_color       #d787ff


# ------------------------------------------------------------------------------
# TAB BAR
# ------------------------------------------------------------------------------

active_tab_foreground   #ffffff
active_tab_background   #6d5dfc
active_tab_font_style   bold

inactive_tab_foreground #a9a6b8
inactive_tab_background #181622
inactive_tab_font_style normal

tab_bar_background      #0b0b12


# ------------------------------------------------------------------------------
# ANSI 16 COLORS
#
# Это цвета, которыми пользуются shell-программы:
# git, ls, btop, grep, компиляторы и т.д.
# ------------------------------------------------------------------------------

# black
color0  #15131d
color8  #5b5769

# red
color1  #ff6b81
color9  #ff8798

# green
color2  #78dba9
color10 #93e8bc

# yellow
color3  #e8c97a
color11 #f2d98f

# blue
color4  #7aa2f7
color12 #94b7ff

# magenta / purple
color5  #b487ff
color13 #c7a4ff

# cyan
color6  #6fd6e5
color14 #89e6f2

# white
color7  #cbc8d8
color15 #f1eff8


# ------------------------------------------------------------------------------
# MARK COLORS
# ------------------------------------------------------------------------------

mark1_foreground #ffffff
mark1_background #6d5dfc

mark2_foreground #0b0b12
mark2_background #78dba9

mark3_foreground #0b0b12
mark3_background #e8c97a
