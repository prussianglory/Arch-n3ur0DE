# ==============================================================================
# Kitty — основной конфиг
# Файл: ~/.config/kitty/kitty.conf
#
# Идея:
#   - тёмный терминал в стиле нашего Arch/Hyprland rice;
#   - фиолетовые акценты, совпадающие с Waybar;
#   - удобно для программирования, системного администрирования и учёбы;
#   - интеграция с будущим Zsh;
#   - Kitty используется Waybar для btop / nvidia-smi / nmtui.
#
# Kitty умеет перечитывать конфиг без перезапуска:
#   Ctrl+Shift+F5
#
# Проверить итоговую конфигурацию:
#   kitty --debug-config
# ==============================================================================


# ------------------------------------------------------------------------------
# МОДУЛЬНАЯ СТРУКТУРА
# ------------------------------------------------------------------------------

# Цветовая схема вынесена отдельно, чтобы её можно было менять,
# не затрагивая поведение терминала.
include theme.conf

# Все наши пользовательские сочетания клавиш лежат отдельно.
include keybindings.conf


# ------------------------------------------------------------------------------
# ШРИФТ
# ------------------------------------------------------------------------------

# Тот же Nerd Font, что используется в Waybar.
# Пакет Arch:
#   sudo pacman -S ttf-jetbrains-mono-nerd
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto

# Базовый размер. Для 1440p обычно 11.5–12.5 выглядит хорошо.
# Если UI кажется мелким — попробуй 12.0 или 12.5.
font_size 11.5

# Лигатуры оставляем включёнными.
# Если захочешь строгий "IDE-like" вид без =>, != и т.п. как лигатур:
# disable_ligatures always
disable_ligatures never


# ------------------------------------------------------------------------------
# КУРСОР
# ------------------------------------------------------------------------------

# В обычных приложениях — block.
# На shell prompt Kitty shell integration может делать его beam.
cursor_shape block

cursor_blink_interval 0.5
cursor_stop_blinking_after 15

# Небольшой trail помогает видеть курсор при больших прыжках по строке
# и визуально хорошо подходит нашему rice.
# Чтобы отключить:
#   cursor_trail 0
cursor_trail 40
cursor_trail_decay 0.08 0.20
cursor_trail_start_threshold 2


# ------------------------------------------------------------------------------
# SCROLLBACK
# ------------------------------------------------------------------------------

# Количество строк, доступных обычной прокруткой.
scrollback_lines 10000

# Отдельная большая история для Ctrl+Shift+H (pager).
# Значение задаётся в мегабайтах.
scrollback_pager_history_size 20

# Полоса прокрутки показывается только тогда, когда она действительно нужна.
scrollbar scrolled
scrollbar_width 0.45
scrollbar_hover_width 0.9
scrollbar_handle_opacity 0.45


# ------------------------------------------------------------------------------
# МЫШЬ / БУФЕР ОБМЕНА / URL
# ------------------------------------------------------------------------------

# Не копируем выделение автоматически в обычный clipboard.
# Это специально: меньше риска случайно затереть пароль или нужный текст.
copy_on_select no

# Безопасное поведение при вставке управляющих последовательностей.
paste_actions quote-urls-at-prompt,confirm

# Ссылки подчёркиваются при наведении.
underline_hyperlinks hover
show_hyperlink_targets ctrl


# ------------------------------------------------------------------------------
# ОКНО
# ------------------------------------------------------------------------------

# Hyprland сам рисует рамки/скругления, поэтому стандартные декорации Kitty
# нам не нужны.
hide_window_decorations yes

# Воздух между текстом и краями окна.
# Если захочешь более компактный терминал — поставь 8.
# Более "luxury" вид — 14–16.
window_padding_width 12

# Внутренний margin Kitty не используем — внешние gaps задаёт Hyprland.
window_margin_width 0

placement_strategy center

# Kitty-окно при тайлинге всё равно контролируется Hyprland.
remember_window_size no
initial_window_width  100c
initial_window_height 30c

# Раскладка окон внутри одного Kitty tab.
# `splits` позволяет делать полноценные вертикальные/горизонтальные сплиты.
enabled_layouts splits,stack


# ------------------------------------------------------------------------------
# ГРАНИЦЫ ВНУТРЕННИХ KITTY WINDOWS
# ------------------------------------------------------------------------------

window_border_width 1pt

# Не затемняем весь терминал при потере фокуса:
# визуальную индикацию фокуса будет делать Hyprland.
inactive_text_alpha 1.0


# ------------------------------------------------------------------------------
# TAB BAR
# ------------------------------------------------------------------------------

# Tabs — наверху, как в IDE.
tab_bar_edge top

# Минималистичный powerline-вариант.
tab_bar_style powerline
tab_powerline_style round

tab_bar_margin_width 8
tab_bar_margin_height 6 2

# Индекс полезен: можно быстро перейти на tab через Ctrl+Alt+1..9.
tab_title_template "{index}  {title}"
tab_title_max_length 28

# На фоне одного tab панель можно скрыть:
#   tab_bar_min_tabs 2
# Я оставляю видимой только если tab'ов >= 2.
tab_bar_min_tabs 2


# ------------------------------------------------------------------------------
# ПРОЗРАЧНОСТЬ
# ------------------------------------------------------------------------------

# Небольшая прозрачность; обои будут слегка просматриваться.
# 1.0 = полностью непрозрачный.
background_opacity 0.92

# Динамическое изменение opacity потребляет дополнительные ресурсы.
# Нам оно не нужно — значение контролируем конфигом.
dynamic_background_opacity no

# Blur лучше делать на стороне Hyprland, чтобы весь rice имел единое поведение.
background_blur 0


# ------------------------------------------------------------------------------
# ЗВУК / УВЕДОМЛЕНИЯ
# ------------------------------------------------------------------------------

# Не пищим терминалом.
enable_audio_bell no

# Если команда выполнялась >= 10 секунд и окно Kitty не видно,
# показываем desktop notification.
# В нашем окружении уведомление подхватит SwayNC.
notify_on_cmd_finish invisible 10.0

# Визуальный bell тоже выключен.
visual_bell_duration 0


# ------------------------------------------------------------------------------
# SHELL / ZSH
# ------------------------------------------------------------------------------

# Мы планируем Zsh как основной shell.
# Здесь специально оставлено ".", чтобы Kitty использовал shell пользователя
# из /etc/passwd / $SHELL.
#
# После настройки Zsh сделаем:
#   chsh -s /usr/bin/zsh
#
# Если захочешь принудительно запускать Zsh только в Kitty:
# shell /usr/bin/zsh
shell .

# Очень полезно для нашего будущего Zsh:
# - Kitty знает cwd;
# - new_window_with_cwd / new_tab_with_cwd работают корректно;
# - Ctrl+Shift+Z/X прыгают между shell prompt;
# - можно смотреть output последней команды.
shell_integration enabled

# Пусть Kitty сам находит $VISUAL / $EDITOR.
# Позже в Zsh зададим EDITOR=nvim и VISUAL=nvim.
editor .


# ------------------------------------------------------------------------------
# БЕЗОПАСНОСТЬ / REMOTE CONTROL
# ------------------------------------------------------------------------------

# Не даём произвольным приложениям управлять Kitty через remote-control API.
# Если позже понадобится scripting — включим адресно.
allow_remote_control no

# Запрос на clone-in-kitty требует подтверждения.
allow_cloning ask


# ------------------------------------------------------------------------------
# ПРОИЗВОДИТЕЛЬНОСТЬ
# ------------------------------------------------------------------------------

# Синхронизация с частотой монитора уменьшает tearing.
sync_to_monitor yes

# TERM не меняем. Kitty сам использует корректное значение xterm-kitty.
# Не добавляй здесь "xterm-256color" без реальной причины.
