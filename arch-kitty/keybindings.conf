# ==============================================================================
# Kitty — пользовательские hotkeys
# Файл: ~/.config/kitty/keybindings.conf
#
# ВАЖНО:
# Эти хоткеи работают ВНУТРИ Kitty.
# Глобальные сочетания запуска терминала, перемещения окон и workspaces
# будут находиться в Hyprland.
# ==============================================================================


# ------------------------------------------------------------------------------
# БАЗОВОЕ
# ------------------------------------------------------------------------------

# Reload конфигурации Kitty.
map ctrl+shift+f5 load_config_file

# Открыть kitty.conf в $EDITOR.
map ctrl+shift+f2 edit_config_file

# Command palette Kitty.
map ctrl+shift+f3 command_palette


# ------------------------------------------------------------------------------
# COPY / PASTE
# ------------------------------------------------------------------------------

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


# ------------------------------------------------------------------------------
# URL / PATH HINTS
# ------------------------------------------------------------------------------

# Выбрать URL с клавиатуры и открыть его.
map ctrl+shift+e kitten hints --type=url

# Найти путь/имя файла в видимом тексте и вставить его в prompt.
map ctrl+shift+p>f kitten hints --type=path --program=-

# Открыть file:line в редакторе.
# После того как в Zsh установим EDITOR=nvim, этот workflow особенно удобен.
map ctrl+shift+p>n kitten hints --type=linenum --linenum-action=tab nvim +{line} {path}


# ------------------------------------------------------------------------------
# SCROLLBACK / SHELL INTEGRATION
# ------------------------------------------------------------------------------

# Открыть scrollback в pager.
map ctrl+shift+h show_scrollback

# Искать по scrollback.
map ctrl+shift+/ search_scrollback

# Предыдущий shell prompt.
map ctrl+shift+z scroll_to_prompt -1

# Следующий shell prompt.
map ctrl+shift+x scroll_to_prompt 1

# Показать output последней команды.
map ctrl+shift+g show_last_command_output


# ------------------------------------------------------------------------------
# KITTY WINDOWS / SPLITS
#
# "window" в терминологии Kitty = pane внутри OS-окна Kitty.
# Это НЕ Hyprland window.
# ------------------------------------------------------------------------------

# Новый pane в текущем каталоге.
map ctrl+shift+enter new_window_with_cwd

# Вертикальный split:
# два pane стоят слева/справа.
map ctrl+shift+alt+v launch --location=vsplit --cwd=current

# Горизонтальный split:
# pane стоят сверху/снизу.
map ctrl+shift+alt+h launch --location=hsplit --cwd=current

# Автоматически выбрать направление split по форме окна.
map ctrl+shift+alt+s launch --location=split --cwd=current

# Перемещение фокуса между pane.
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down

# Изменение размера активного pane.
map ctrl+shift+alt+left  resize_window narrower 3
map ctrl+shift+alt+right resize_window wider 3
map ctrl+shift+alt+up    resize_window shorter 2
map ctrl+shift+alt+down  resize_window taller 2

# Закрыть текущий pane.
map ctrl+shift+w close_window


# ------------------------------------------------------------------------------
# TABS
# ------------------------------------------------------------------------------

# Новый tab в текущем каталоге.
map ctrl+shift+t new_tab_with_cwd

map ctrl+shift+right next_tab
map ctrl+shift+left  previous_tab

# Закрыть tab.
map ctrl+shift+q close_tab

# Быстрый переход к tabs 1–9.
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5
map ctrl+alt+6 goto_tab 6
map ctrl+alt+7 goto_tab 7
map ctrl+alt+8 goto_tab 8
map ctrl+alt+9 goto_tab 9


# ------------------------------------------------------------------------------
# FONT SIZE
# ------------------------------------------------------------------------------

map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+backspace change_font_size all 0


# ------------------------------------------------------------------------------
# ПОЛНОЭКРАННЫЙ РЕЖИМ
# ------------------------------------------------------------------------------

map ctrl+shift+f11 toggle_fullscreen
